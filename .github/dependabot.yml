version: 2
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 0  # version-update PRs off; security alerts/updates unaffected
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0  # version-update PRs off; security alerts/updates unaffected
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
